# MC/DC HDF5 layout illustration: {element}.h5.

'@format': mcdc-data
'@format-version': 0.1.0

source-libraries/:
  '{library}/':
    title: string
    version: string
    release-date: string
    reference: string
    comments: string
    format: string
    format-version: string
    processing-date: string
    conversion-time: string

atomic-number: integer

atomic-relaxation/:
  subshells/:
    '{subshell}/':
      designator: integer
      binding-energy: float, eV
      electron-count: float
      transitions/:
        energy: float [T], eV
        probability: float [T]  # Branching probabilities for this vacancy
        origin-designator: integer [T]  # Shell supplying the filling electron
        secondary-designator: integer [T]  # Zero for a radiative transition, otherwise the second vacancy shell

projectiles/:
  # ====================================================================================
  # Electron
  # ====================================================================================

  electron/:
    xs-energy-grid: float [N], eV

    reactions/:
      elastic/:
        # Basic fields
        '@ENDF-MT': integer  # Optional source metadata
        '@GNDS-label': string  # Optional original source label, preserved exactly
        '@category': elastic-scattering
        xs: CrossSection
        reference-frame: LAB or COM
        cross-products/: {}

        # Category-specific
        large-angle/:
          xs: Data, barn  # Stored on its own incident-energy grid
          angular-cosine-distribution: Distribution, cosine


      excitation/:
        # Basic fields
        '@ENDF-MT': integer  # Optional source metadata
        '@GNDS-label': string  # Optional original source label, preserved exactly
        '@category': excitation
        xs: CrossSection
        reference-frame: LAB or COM
        cross-products/:
          '{i}': CrossProduct  # Optional de-excitation photon production

        # Category-specific
        energy-loss: Data, eV


      bremsstrahlung/:
        # Basic fields
        '@ENDF-MT': integer  # Optional source metadata
        '@GNDS-label': string  # Optional original source label, preserved exactly
        '@category': bremsstrahlung
        xs: CrossSection
        reference-frame: LAB or COM
        cross-products/:
          '{i}': CrossProduct  # Optional photon production when source distributions are available

        # Category-specific
        energy-loss: Data, eV


      ionization/:
        # Basic fields
        '@ENDF-MT': integer  # Optional source metadata
        '@GNDS-label': string  # Optional original source label, preserved exactly
        '@category': ionization
        xs: CrossSection
        reference-frame: LAB or COM
        cross-products/:
          '{i}': CrossProduct  # Optional shell-averaged production, instead of subshell entries

        # Category-specific
        subshells/:
          '{subshell}/':
            binding-energy: float, eV
            xs: Data, barn  # Stored on the subshell's own incident-energy grid
            secondary-energy-distribution: Distribution, eV
            cross-products/:
              '{i}': CrossProduct  # Optional relaxation photons conditional on this subshell

  # ====================================================================================
  # Photon
  # ====================================================================================

  photon/:
    xs-energy-grid: float [N], eV

    reactions/:
      coherent-scattering/:
        # Basic fields
        '@ENDF-MT': 502  # Optional source metadata
        '@GNDS-label': string  # Optional original source label, preserved exactly
        '@category': coherent-scattering
        xs: CrossSection
        reference-frame: LAB or COM
        cross-products/: {}

        # Category-specific
        form-factor: Data, dimensionless  # Input is momentum-transfer coordinate in 1/angstrom


      incoherent-scattering/:
        # Basic fields
        '@ENDF-MT': 504  # Optional source metadata
        '@GNDS-label': string  # Optional original source label, preserved exactly
        '@category': incoherent-scattering
        xs: CrossSection
        reference-frame: LAB or COM
        cross-products/:
          '{i}': CrossProduct  # Optional recoil-electron production

        # Category-specific
        scattering-function: Data, dimensionless  # Optional; input is momentum-transfer coordinate in 1/angstrom


      photoelectric/:
        # Basic fields
        '@ENDF-MT': 522  # Optional source metadata
        '@GNDS-label': string  # Optional original source label, preserved exactly
        '@category': photoelectric
        xs: CrossSection
        reference-frame: LAB or COM
        cross-products/:
          '{i}': CrossProduct  # Optional shell-averaged production, instead of subshell entries

        # Category-specific
        subshells/:
          '{subshell}/':
            designator: integer  # Shell identity shared with atomic-relaxation
            binding-energy: float, eV
            xs: Data, barn
            cross-products/:
              '{i}': CrossProduct  # Optional photoelectron production conditional on this subshell


      pair-production-electron-field/:
        # Basic fields
        '@ENDF-MT': 515  # Optional source metadata
        '@GNDS-label': string  # Optional original source label, preserved exactly
        '@category': pair-production
        xs: CrossSection
        reference-frame: LAB or COM
        cross-products/:
          '{i}': CrossProduct  # Optional electron and positron production

        # Category-specific
        field: electron


      pair-production-nuclear-field/:
        # Basic fields
        '@ENDF-MT': 517  # Optional source metadata
        '@GNDS-label': string  # Optional original source label, preserved exactly
        '@category': pair-production
        xs: CrossSection
        reference-frame: LAB or COM
        cross-products/:
          '{i}': CrossProduct  # Optional electron and positron production

        # Category-specific
        field: nuclear
