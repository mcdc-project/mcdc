# MC/DC HDF5 layout illustration: {nuclide}.h5.

'@format': mcdc-data
'@format-version': 0.1.0

source-libraries/:
  '{library}/':
    title: string
    version: string
    release-date: string
    reference: string
    comments: string
    format: string
    format-version: string
    processing-date: string
    conversion-time: string

mass-number: integer
atomic-weight-ratio: float  # Target mass / neutron mass
excitation-level: integer  # Excitation-state index
fissionable: boolean

radiation-length: float, g/cm2

projectiles/:
  # ====================================================================================
  # Proton
  # ====================================================================================

  proton/:
    stopping-power: Data, eV cm2/g  # Optional for analog transport, required for condensed-history energy loss
    xs-energy-grid: float [N], eV

    reactions/:
      elastic/:
        # Basic fields
        '@ENDF-MT': integer  # Optional source metadata
        '@GNDS-label': string  # Optional original source label, preserved exactly
        '@category': elastic-scattering
        xs: CrossSection
        reference-frame: LAB or COM
        Q-value: float, eV
        cross-products/: {}

        # Category-specific
        angular-cosine-distribution: Distribution, cosine


      inelastic/:
        # Basic fields
        '@ENDF-MT': integer  # Optional source metadata
        '@GNDS-label': string  # Optional original source label, preserved exactly
        '@category': inelastic-scattering
        xs: CrossSection
        reference-frame: LAB or COM
        Q-value: float, eV
        cross-products/:
          '{i}': CrossProduct  # Optional emitted species other than protons

        # Category-specific
        multiplicity: integer  # Outgoing protons only
        angular-cosine-distribution: Distribution, cosine  # Omit for a joint energy-angle spectrum
        spectrum-probability-grid: float [B + 1], eV
        spectrum-probability: float [B, S]
        energy-spectrum-{i}: Distribution, eV


      capture/:
        # Basic fields
        '@ENDF-MT': integer  # Optional source metadata
        '@GNDS-label': string  # Optional original source label, preserved exactly
        '@category': capture
        xs: CrossSection
        reference-frame: LAB or COM
        Q-value: float, eV
        cross-products/:
          '{i}': CrossProduct  # Optional emitted species other than protons
